<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Changing Background of a box</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="p-10">
    <div id="colorBox" class="w-40 h-40 rounded-2xl bg-gray-300"></div>

    <script>
      const boxId = document.getElementById("colorBox");
      boxId.classList.remove("bg-gray-300");
      boxId.classList.add("bg-blue-500");
    </script>
  </body>
</html>
